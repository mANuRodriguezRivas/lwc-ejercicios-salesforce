<template>
    <lightning-card title="Contador de Tiempo">
        <div class="container">
            <p class="time">{seconds} s</p>
            <div class="buttons">
                <lightning-button label="Iniciar" onclick={start}></lightning-button>
                <lightning-button label="Pausar" onclick={pause}></lightning-button>
                <lightning-button label="Reiniciar" onclick={reset}></lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
